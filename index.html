<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La-Weight</title>
<style>
:root{--bg:#000;--card:#161616;--line:#2a2a2a;--orange:#FF9000;--text:#fff;--muted:#a8a8a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:2px solid var(--orange);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:30px;letter-spacing:-.02em}
.logo span+span{background:var(--orange);color:#000;border-radius:6px;padding:0 10px}
.dl{color:var(--orange);border:2px solid var(--orange);border-radius:8px;padding:8px 16px;font-weight:700;text-decoration:none}
.dl:hover{background:var(--orange);color:#000}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
main{padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px 20px;max-width:1600px;margin:0 auto}
.item{display:flex;flex-direction:column;gap:8px}
.media{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;border:2px solid var(--line)}
.media:hover{border-color:var(--orange)}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.media video.on{object-fit:contain}
.cover{all:unset;position:absolute;inset:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cover svg{filter:drop-shadow(0 2px 6px #000a)}
.dur{position:absolute;right:8px;bottom:8px;background:#000c;color:#fff;font-size:13px;font-weight:700;padding:2px 8px;border-radius:4px}
.title{font-weight:700;font-size:16px;line-height:1.3}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:10;padding:24px}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
#lbx{position:absolute;top:16px;right:16px;background:var(--orange);color:#000;border:0;border-radius:8px;font-weight:800;font-size:16px;padding:10px 18px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.media{transition:border-color .15s}}
</style>
</head>
<body>

<header>
  <div class="logo"><span>La-</span><span>Weight</span></div>
  <!-- Replace the href below with your Dropbox link -->
  <a class="dl" href="PASTE_YOUR_DROPBOX_LINK_HERE" target="_blank" rel="noopener">Download via dropbox</a>
</header>

<main id="feed"></main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lbx" type="button">Close</button>
  <img id="lbimg" alt="">
</div>

<script>
// Put this index.html in the same folder as the photos and videos.
// Newest first. t = "v" (video) or "i" (image); d = duration shown on videos.
const ITEMS = [
  {t:"v", f:"VID_20261126_180535.mp4", d:"0:06", n:"Final Weigh-In"},
  {t:"v", f:"VID_20261126_180106.mp4", d:"0:22", n:"The Big Load Test"},
  {t:"v", f:"VID_20261126_174956.mp4", d:"0:14", n:"Handle With Care"},
  {t:"v", f:"VID_20261126_174350.mp4", d:"0:11", n:"Heavy Lifting, Light Work"},
  {t:"v", f:"VID_20261126_174007.mp4", d:"0:19", n:"Going Over the Limit"},
  {t:"i", f:"MVIMG_20261126_173834.jpg", n:"Photobomb Level: Duck Face"},
  {t:"i", f:"MVIMG_20261126_173831.jpg", n:"Tongue Out, Side-Eye On"},
  {t:"i", f:"MVIMG_20261126_173728.jpg", n:"Brim Check"},
  {t:"i", f:"MVIMG_20261126_173723.jpg", n:"Do Not Disturb the Hat"},
  {t:"i", f:"MVIMG_20261126_173710.jpg", n:"Sun's Out, Hat's Out"},
  {t:"i", f:"MVIMG_20261126_173706.jpg", n:"Quack Attack"},
  {t:"v", f:"VID_20261126_173403.mp4", d:"0:06", n:"Under Pressure"},
  {t:"v", f:"VID_20261126_172929.mp4", d:"0:08", n:"Sunset Load Test"},
  {t:"i", f:"MVIMG_20261126_164219.jpg", n:"Cutting It Close"},
  {t:"v", f:"VID_20261126_153350.mp4", d:"0:09", n:"Measuring Up"},
  {t:"v", f:"VID_20261126_153313.mp4", d:"0:08", n:"Taking the Weight"},
  {t:"v", f:"VID_20261126_153111.mp4", d:"0:07", n:"Balanced Performance"},
  {t:"v", f:"VID_20261126_152940.mp4", d:"0:09", n:"Overload Alert Triggered"},
  {t:"v", f:"VID_20261126_152509.mp4", d:"0:06", n:"Quick Weigh-In"},
  {t:"v", f:"VID_20261126_151737.mp4", d:"0:11", n:"Total Load Capacity"},
  {t:"v", f:"VID_20261126_151605.mp4", d:"0:09", n:"Day One Setup"}
];

const PLAY = '<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="28" fill="#FF9000"/><path d="M23 17l17 11-17 11z" fill="#000"/></svg>';
const feed = document.getElementById("feed");
const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
let lastFocus = null;

function esc(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}

ITEMS.forEach(it => {
  const el = document.createElement("div");
  el.className = "item";
  const name = esc(it.n);
  if (it.t === "v") {
    el.innerHTML =
      '<div class="media"><video src="' + it.f + '#t=0.1" preload="metadata" playsinline></video>' +
      '<button type="button" class="cover" aria-label="Play video: ' + name + '">' + PLAY + '</button>' +
      '<span class="dur">' + it.d + '</span></div><div class="title">' + name + '</div>';
    const v = el.querySelector("video"), b = el.querySelector(".cover"), d = el.querySelector(".dur");
    b.addEventListener("click", () => {
      document.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); });
      b.style.display = "none"; d.style.display = "none";
      v.classList.add("on"); v.controls = true; v.play();
    });
    v.addEventListener("ended", () => { b.style.display = ""; d.style.display = ""; v.controls = false; v.classList.remove("on"); v.currentTime = 0.1; });
  } else {
    el.innerHTML =
      '<div class="media"><img src="' + it.f + '" alt="' + name + '" loading="lazy">' +
      '<button type="button" class="cover" aria-label="View photo: ' + name + '"></button></div>' +
      '<div class="title">' + name + '</div>';
    el.querySelector(".cover").addEventListener("click", e => {
      lastFocus = e.currentTarget; lbimg.src = it.f; lbimg.alt = it.n;
      lb.classList.add("open"); document.getElementById("lbx").focus();
    });
  }
  feed.appendChild(el);
});

function closeLb(){ lb.classList.remove("open"); lbimg.src = ""; if (lastFocus) lastFocus.focus(); }
document.getElementById("lbx").addEventListener("click", closeLb);
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && lb.classList.contains("open")) closeLb(); });
</script>
</body>
</html>
